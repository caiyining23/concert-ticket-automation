<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SeatFlow</title><link rel="stylesheet" href="src/popup.css"></head><body>
<header><h1>SeatFlow</h1><p>Melon Ticket companion</p></header>
<label for="selector">Available seat CSS selector</label><textarea id="selector" rows="3" spellcheck="false"></textarea>
<small>Selectors depend on the live seat-page markup. Verify visually before use.</small>
<div class="group"><label for="count">Maximum seat selections</label><input id="count" type="number" min="1" max="4" value="1"></div>
<label class="check"><input id="notify" type="checkbox" checked> Desktop notification</label>
<label class="check"><input id="click" type="checkbox"> Click matching visible seats (opt-in)</label>
<div class="actions"><button id="start">Start</button><button id="stop" class="secondary">Stop</button></div>
<div class="status" id="status" role="status">Open a Melon Ticket page to begin.</div>
<footer>No CAPTCHA bypass. Checkout and payment remain manual.</footer>
<script type="module" src="src/popup.js"></script>
</body></html>
